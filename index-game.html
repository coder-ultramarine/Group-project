<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Quiz</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #10141b; color: #f4f7fb; }
    .quiz-page { max-width: 720px; margin: 0 auto; }
    .quiz-page h1 { margin-bottom: 12px; font-size: 2rem; }
    .quiz-page p { line-height: 1.6; color: #ced7e2; }
    .quiz-button { margin-top: 18px; padding: 12px 18px; border: none; border-radius: 6px; background: #2466f7; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="quiz-page">
    <h1>Game Quiz</h1>
    <p>This is the quiz iframe page. Your main app is loaded in the parent window, and this page is shown inside the quiz frame when you click "Open quiz." </p>
    <p>If you want to add quiz questions, place them in a separate JavaScript file and load them here.</p>
    <button class="quiz-button" onclick="alert('Quiz content is a placeholder.');">Start placeholder quiz</button>
  </div>
</body>
</html>
