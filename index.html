<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Library</title>
  <link rel="stylesheet" href="style.site.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">Library</div>
      <div class="brand-sub">Your game collection</div>
    </header>

    <div class="quiz-launcher">
      <button id="openQuizBtn" class="btn btn-primary" type="button">Open quiz</button>
      <button id="closeQuizBtn" class="btn" type="button">Close quiz</button>
    </div>

    <div id="quizContent" class="quiz-content"></div>
    <main id="app"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
